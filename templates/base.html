<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViperFac - Sistema de Facturación</title>
    {% load static %}
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">ViperFac</h1>
            <p class="text-blue-200">Sistema de Facturación</p>
        </div>
    </nav>
    
    <main class="container mx-auto mt-8 px-4">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">Bienvenido a ViperFac</h2>
            <p class="text-gray-600 mb-6">Tu sistema de facturación profesional</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                    <h3 class="text-lg font-semibold text-green-800 mb-2">Facturas</h3>
                    <p class="text-green-600">Gestiona tus facturas fácilmente</p>
                    <button class="mt-3 bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded transition duration-200">
                        Ver Facturas
                    </button>
                </div>
                
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <h3 class="text-lg font-semibold text-blue-800 mb-2">Clientes</h3>
                    <p class="text-blue-600">Administra tu base de clientes</p>
                    <button class="mt-3 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition duration-200">
                        Ver Clientes
                    </button>
                </div>
                
                <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
                    <h3 class="text-lg font-semibold text-purple-800 mb-2">Reportes</h3>
                    <p class="text-purple-600">Analiza tu negocio con reportes</p>
                    <button class="mt-3 bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded transition duration-200">
                        Ver Reportes
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="bg-gray-800 text-white text-center py-6 mt-12">
        <p>&copy; 2024 ViperFac. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
